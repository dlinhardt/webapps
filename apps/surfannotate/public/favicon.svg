<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="SurfAnnotate">
  <!-- A surface with an area delineated on it, in the app's own colours: the
       grey of an unlabelled mesh, the gold of a traced border, the red of a
       filled region. Two shapes and a line, so it still reads at 16px, where
       only the silhouette and the colour bands survive. -->
  <rect width="32" height="32" rx="8" fill="#131a24"/>
  <circle cx="16" cy="16" r="11.5" fill="#98a3b3"/>
  <path d="M4.9 13 A11.5 11.5 0 0 1 27.1 13 Z" fill="#e0453f"/>
  <path d="M4.9 13 H27.1" stroke="#ffd91a" stroke-width="3.2" stroke-linecap="butt"/>
</svg>
